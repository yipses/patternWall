name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time. A run in progress is allowed to finish rather than
# being cancelled by the next push: cancelling mid-deploy leaves the Pages
# environment holding a half-promoted artifact, and the next run has to sort it
# out. Queued runs still collapse, so a burst of pushes deploys the last one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The gates run before the build, not after a green deploy. This workflow
      # used to go straight from `npm ci` to `npm run build`, so a failing
      # typecheck, lint or unit test still shipped — the only thing that could
      # stop a deploy was a build that would not compile. e2e is deliberately
      # left out: it builds the export itself and would double the run for a
      # suite that is about the browser rather than about what gets published.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # A project site is served from https://<user>.github.io/<repo>/, so the
      # asset URLs Next bakes into the HTML have to carry that prefix.
      - run: npm run build
        env:
          PATTERNWALL_BASE_PATH: /${{ github.event.repository.name }}
      # Pages will not serve a directory containing an `_`-prefixed entry
      # unless Jekyll is disabled, and Next's output lives in `_next`.
      - run: touch apps/web/out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
