name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, and let a new push supersede a running one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A project site is served from https://<user>.github.io/<repo>/, so the
      # asset URLs Next bakes into the HTML have to carry that prefix.
      - run: npm run build
        env:
          PATTERNWALL_BASE_PATH: /${{ github.event.repository.name }}
      # Pages will not serve a directory containing an `_`-prefixed entry
      # unless Jekyll is disabled, and Next's output lives in `_next`.
      - run: touch apps/web/out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
